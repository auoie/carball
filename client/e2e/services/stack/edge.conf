# The stack's edge (compose.yaml): the page and the accounts service on one origin, as the deployment's tunnel routes
# them (/api/ to the service, the rest to the web image), the client's address in Cloudflare's header (the service
# believes it from the stack's network: TRUSTED_PROXIES); the game servers' calls to the service come this way too
server {
    listen 8080;
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $http_host;
    }
}
