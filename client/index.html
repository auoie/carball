<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freeplay</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23e8e8e8%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading">Loading…</div>
    <div id="hud">
      <div id="score">
        <span id="score-blue" class="team blue">0</span>
        <span id="clock" hidden>5:00</span>
        <span id="score-orange" class="team orange">0</span>
      </div>
      <div id="message" hidden></div>
      <div id="message-hint" hidden></div>
      <div id="vote">
        <div id="vote-head"><span id="vote-tally"></span><span id="vote-time"></span></div>
        <div id="vote-bar"><div id="vote-fill"></div></div>
        <div id="vote-hint"></div>
      </div>
      <div id="flip" data-state="ground" hidden>
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="42" />
          <circle id="flip-ring" cx="50" cy="50" r="42" />
        </svg>
        <span id="flip-label">FLIP</span>
        <span id="flip-detail"></span>
      </div>
      <div id="flip-toast">FLIP RESET</div>
      <div id="respawn" hidden>
        <span id="respawn-time"></span>
        <div id="respawn-sides"><span id="respawn-left"></span><span id="respawn-right"></span></div>
        <div id="respawn-bar"><div id="respawn-fill"></div></div>
      </div>
      <div id="boost">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="50" />
          <circle id="boost-ring" cx="60" cy="60" r="50" />
        </svg>
        <span id="boost-value">0</span>
      </div>
      <div id="info">
        <span id="speed">0 uu/s</span>
        <span id="camera-mode">Car cam</span>
        <span id="fps">0 fps</span>
        <span id="net" hidden></span>
      </div>
      <div id="help" hidden></div>
      <div id="hint">Esc: settings · H: controls · M: mute</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
