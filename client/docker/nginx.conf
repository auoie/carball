# The web client's static files on :3000 (APP-CONTRACT.md)
server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css application/json application/wasm application/octet-stream image/svg+xml;
    gzip_min_length 1024;
    server_tokens off;
    # (relative Location headers: behind the tunnel an absolute one named this container's :3000, RV-396)
    absolute_redirect off;
    include /etc/nginx/security-headers.conf;

    # (the container's health check)
    location = /healthz {
        access_log off;
        include /etc/nginx/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }
    # (written at start from GAME_SERVER_URL: never cached)
    location = /config.json {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    # (hashed file names: cached for good)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    # (the bots' packages, Play vs Bots' downloads: names unhashed, revalidated; a missing file a 404, not the page, which
    # the policy's loader would read as a model, RV-537)
    location /bots/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
