# Every response's security headers (RV-371), included in each location (a location's own add_header drops the
# server's): no MIME sniffing, no referrer, the page never framed, and a Content-Security-Policy: scripts and everything
# else from this origin only (the engine's WebAssembly compiled: 'wasm-unsafe-eval'; its bindings need no eval), inline
# styles (the chat log's coloured spans), data: images (the icon), data: fetches (the arena meshes the build inlines),
# and the game server's origin alone over https (WebTransport: from GAME_SERVER_URL at start, RV-395)
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
include /etc/nginx/carball-csp.conf; # (written at start: its connect-src the game server's origin, 40-carball-config.sh)
