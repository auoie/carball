# Every response's security headers (RV-371), included in each location (a location's own add_header drops the
# server's): no MIME sniffing, no referrer, the page never framed, and a Content-Security-Policy: scripts and everything
# else from this origin only (the engine's WebAssembly compiled: 'wasm-unsafe-eval'; its bindings need no eval), inline
# styles (the chat log's coloured spans), data: images (the icon), data: fetches (the arena meshes the build inlines),
# the game server over https (WebTransport), and a development server's info on this machine (?queue=)
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: https: http://localhost:* http://127.0.0.1:*; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
