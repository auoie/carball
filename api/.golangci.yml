# golangci-lint's configuration for carball-api (the installed golangci-lint 2.15: README.md "Checks"). The standard set
# (govet, staticcheck, errcheck, ineffassign, unused) and the bug-finders the user asked for; gofmt as the formatter.
version: "2"
linters:
  default: standard
  enable:
    - bodyclose # (every HTTP response body closed)
    - errorlint # (errors compared with errors.Is / errors.As: wrapped ones too)
    - exhaustive # (a switch over an enum names every value)
    - gochecksumtype # (a type switch over a sealed interface (//sumtype:decl) names every variant)
    - gosec
    - noctx # (every outbound request carries a context: its timeout, the caller's cancel)
    - revive
    - rowserrcheck
    - sqlclosecheck
  settings:
    exhaustive:
      # (a default branch doesn't excuse a missing value)
      default-signifies-exhaustive: false
    gochecksumtype:
      default-signifies-exhaustive: false
    govet:
      enable-all: true
      disable:
        - fieldalignment # (structs laid out for reading, not for padding)
        - shadow # (an inner `err` is Go's idiom)
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
  exclusions:
    rules:
      # (the tests' throwaway servers and fixtures: gosec's rules for production code)
      - path: _test\.go|internal/test(db|oidc)/
        linters:
          - gosec
formatters:
  enable:
    - gofmt
