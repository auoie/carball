[package]
name = "carball-server"
version = "0.1.0"
edition = "2024"
description = "Authoritative game server: the patched engine (C++) behind WebTransport"
publish = false
# (`cargo run`: the network server; the local host is built by scripts/build_host.sh)
default-run = "carball-server"

[dependencies]
anyhow = "1"
getrandom = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"], optional = true }
wtransport = { version = "0.7", features = ["quinn"], optional = true }
# (the search tickets' Ed25519 and base64: already in the tree through rustls, so offline builds have them)
ring = { version = "0.17", optional = true }
base64 = { version = "0.22", optional = true }
libc = "0.2"

[features]
default = ["net"]
# The network server: WebTransport, the queue, the game loop's thread (the release image's build)
net = ["dep:tokio", "dep:wtransport", "dep:ring", "dep:base64"]
# The browser's local host (src/bin/host.rs: an offline match against bots, in a worker): built for
# wasm32-unknown-emscripten with --no-default-features --features host (scripts/build_host.sh)
host = []

[[bin]]
name = "carball-server"
path = "src/main.rs"
required-features = ["net"]

[[bin]]
name = "carball-host"
path = "src/bin/host.rs"
required-features = ["host"]

[dev-dependencies]
serde_json = "1"

[build-dependencies]
cmake = "0.1"

[profile.release]
debug = 1
