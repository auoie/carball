[package]
name = "carball-server"
version = "0.1.0"
edition = "2024"
description = "Authoritative game server: the patched engine (C++) behind WebTransport"
publish = false
# (`cargo run`: the network server; the local host is built by scripts/build_host.sh)
default-run = "carball-server"

[dependencies]
anyhow = "1"
getrandom = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"], optional = true }
wtransport = { version = "0.7", features = ["quinn"], optional = true }
# (base64: the tickets' keys list, a ticket's one-time id)
base64 = { version = "0.22", optional = true }
# (the results' and quitters' HTTPS calls to the accounts service: rustls with Mozilla's roots built in (webpki-roots),
# no OpenSSL, no cookies; pinned: the user's choice, 2026-10-18)
reqwest = { version = "=0.12.22", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
# (the calls' JSON: already in the tree, the tests')
serde_json = { version = "1", optional = true }
# (the log: one line per event, the network server's and the local host's; the game's modules are both's)
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"], optional = true }
# (the development info server and the health endpoint: axum's routes on hyper's HTTP/1 connections, their header read
# time and number capped)
axum = { version = "0.8", default-features = false, optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "service"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# (the network server's command line: its flags, each with its environment variable, APP-CONTRACT.md)
clap = { version = "4", features = ["derive", "env"], optional = true }
# (the match tickets: JWTs signed with Ed25519, the accounts service's; 9.x, on ring like the rest)
jsonwebtoken = { version = "9.3.1", default-features = false, optional = true }
governor = { version = "0.10.4", default-features = false, features = ["std"], optional = true }
tracing-appender = { version = "0.2", optional = true }
# (the benchmark's counters, `GET /metrics` on the development info server alone: Prometheus text, notes/benchmarks.md)
prometheus-client = { version = "0.25.1", optional = true }

[features]
default = ["net"]
# The network server: WebTransport, the queue, the game loop's thread (the release image's build)
net = [
    "dep:tokio",
    "dep:governor",
    "dep:tracing-appender",
    "dep:wtransport",
    "dep:base64",
    "dep:reqwest",
    "dep:serde_json",
    "dep:axum",
    "dep:hyper",
    "dep:hyper-util",
    "dep:serde",
    "dep:tracing-subscriber",
    "dep:clap",
    "dep:jsonwebtoken",
    "dep:prometheus-client",
]
# The browser tests' hooks (the Dockerfile's game-e2e image and the local browser tests' builds, never a release's):
# --test-goal-after, --forfeit-vote-wait, and an e2e stack's accounts service over plain http (API_URL http://HOST:PORT,
# on the stack's own network)
e2e = ["net"]
# The browser's local host (src/bin/host.rs: an offline match against bots, in a worker): built for
# wasm32-unknown-emscripten with --no-default-features --features host (scripts/build_host.sh)
host = ["dep:tracing-subscriber"]

[[bin]]
name = "carball-server"
path = "src/main.rs"
required-features = ["net"]

[[bin]]
name = "carball-host"
path = "src/bin/host.rs"
required-features = ["host"]

[dev-dependencies]
serde_json = "1"
# (the tests' tickets: their Ed25519 keys from seeds, signed as the accounts service signs; in the tree already)
ring = "0.17"
wiremock = "0.6"
# (the engine's bindings, src/engine_ffi.rs, made and checked by tests/engine_bindings.rs: bindgen's exact version, its
# output changing with it; libclang loaded at run time, clang-sys telling whether there's one)
bindgen = { version = "=0.73.2", default-features = false, features = ["runtime"] }
clang-sys = { version = "1.9.1", features = ["runtime"] }

[build-dependencies]
cmake = "0.1"

[profile.release]
debug = 1
